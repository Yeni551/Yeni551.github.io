    <h1>AutoLedger</h1>
    <p>AutoLedger 是個人使用的財務管理工具，協助整理 Gmail 中的銀行與信用卡通知，供使用者查看與管理。</p>
    <p>應用程式僅以 Google Gmail API 的唯讀權限讀取郵件，不會寄送、修改、刪除或標記郵件。</p>
    <p>授權資料保存在使用者自己的裝置上；交易資料在本機處理與保存，不會透過此網站收集。</p>
